name: Build and Deploy Release

on:
  push:
    tags:
      - 'v*.*.*'  # Push events to matching v*, i.e. v1.0.0, v20.15.10

jobs:
  build_and_release:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write  # Needed to create a GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Additional dev dependencies for building
          pip install -r requirements-dev.txt

      - name: Build Portable Executable (PyInstaller)
        run: |
          pyinstaller -y StudyMate.spec
          
      - name: Build Setup Wizard (Inno Setup)
        run: |
          # ISCC is pre-installed on GitHub Actions windows-latest
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Zip Portable Directory
        run: Compress-Archive -Path dist/StudyMate -DestinationPath dist/StudyMate_Portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            InnoSetup/StudyMate_Installer.exe
            dist/StudyMate_Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
